name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # A2 compares the common shipped read path at the immutable handoff base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependency / lockfile integrity
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Spec-lock / acceptance register / open-gates consistency
        if: ${{ !cancelled() }}
        run: pnpm run check:spec
      - name: Zero-confirmation opening (mechanism only; live client UNRUN)
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/integration/zero-confirmation-opening.test.ts
      - name: A2 whole-path evidence and BLUE H1 regressions
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/integration/chat-collection-prep-evidence.test.ts tests/integration/chat-collection-prep-boundaries.test.ts tests/integration/chat-collection-prep.test.ts
      - name: Unit
        if: ${{ !cancelled() }}
        run: pnpm run test:unit
      - name: Contract
        if: ${{ !cancelled() }}
        run: pnpm run test:contract
      - name: Conformance (register integrity; no engine conformance tests exist yet)
        if: ${{ !cancelled() }}
        run: pnpm run test:conformance
      - name: Security static/config checks
        if: ${{ !cancelled() }}
        run: pnpm run test:security
      - name: Integration smoke
        if: ${{ !cancelled() }}
        # The focused startup/A2/H1 files ran above; every integration file runs once.
        run: pnpm run test:integration --exclude tests/integration/phone-referee-startup.test.ts --exclude tests/integration/phone-referee-startup-evidence.test.ts --exclude tests/integration/zero-confirmation-opening.test.ts --exclude tests/integration/chat-collection-prep-evidence.test.ts --exclude tests/integration/chat-collection-prep-boundaries.test.ts --exclude tests/integration/chat-collection-prep.test.ts

  referee-startup:
    name: Referee real-startup/restart and matched base evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real main, authenticated tasks, restart/wipe/refusal/concurrency and §1A before/after (mechanism only)
        run: pnpm exec vitest run tests/integration/phone-referee-startup.test.ts tests/integration/phone-referee-startup-evidence.test.ts

  h07-evidence:
    name: H-07 matched persistence evidence
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/h07-') || github.head_ref == 'codex/two-review-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Matched before/after matrix and exceptional-cost accounting
        env:
          H07_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/h07-benchmark.sh
      - name: Retain reproducible raw H-07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h07-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            /tmp/immortalis-h07-evidence/raw/*.json
            /tmp/immortalis-h07-evidence/fixtures/*.seed.json
            /tmp/immortalis-h07-evidence/summary.json
            /tmp/immortalis-h07-evidence/report.md
