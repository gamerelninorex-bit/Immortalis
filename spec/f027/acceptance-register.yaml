  - id: IA-04
    family: IA
    title: "Turnless causal ordering"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/temporal"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Foundation aspect only, on one deliberately small deterministic fixture under EXACT-PARTITION (CAL-01 stays UNCALIBRATED; no approximate tolerance is represented, accepted, inferred or defaulted): strict RC-03 TemporalRead (AS-OF-NOW / AS-OF-DECLARED-CLOSE with a required producer-named, horizon-independent Close Basis; no third mode), RC-04 StageKey (causal process, owner operation, prospective result; horizon, source version, retry, message count and slice/repartition are structurally not identity dimensions), RC-05 ResolutionTransaction (no universal turn number; opening basis, target/condition, actual stop/remainder, engaged refs, rule/source versions, committed groups, unresolved dependents) and the minimum RC-10 TemporalObject, coordinated by IM-02 over the existing IM-11/IM-12/IM-17 substrate: a transient stage-indexed graph (never persisted) with NOW-only instantaneous SCC testing over stage identity, CLOSE as the only lag cut yet still a dependency, resolution of the causally engaged cone only (active boundary index, no scan), in-place recompute of an unresolved stage under the same StageKey, committed stages adopted and never recreated, bounded stop/remainder persisted and continued after save/close/load, and unrelated dormant state untouched. Canonical time cannot pass an active earned boundary (raw/tampered kernel commits included), RC-05 engaged references keep unresolved work represented and untouched, and a held continuation must be consumed by the next transaction. Not implemented: cancellation/supersession of a held continuation, GROUP mechanisms (so every instantaneous cycle is unlawful), SEALED/EVENT/CONDITIONAL edges, recurrence/recurring boundaries, more than one earned boundary per object, cross-object dependents, APPROXIMATE-PARTITION, stochastic opportunities/hazards, mortality coverage, compression/re-expansion, same-time contention beyond bookkeeping order, the information/interruption gate, no-active-PC stop predicates beyond the one declared boundary predicate, any other real subsystem's temporal declaration, and OB-015 live continuation. Population is the first real subsystem temporal declaration (bounded synthetic fixture): Criterion Owner to Population composition is AS-OF-NOW at the composition point, Population to dependent consumer is AS-OF-DECLARED-CLOSE at the named ordinary reconciliation close (enforced at object registration and re-verified on load), and a consumer-declared PCB-01 barrier makes the next eligible engaged-scope Population reconciliation due only when a committed, eligible, unconsumed envelope precedes and intersects the consumer's engaged scope and the latest close omits it, evaluated for an engaged consumer only (no scan, cadence or second scheduler); otherwise the consumer reads the latest committed close or is not credited, and an unresolved reconciliation leaves independent work eligible; the due claim is retained as evidence in the sealed transaction and re-derived from the committed Population stage group (replaying consumed envelopes in order, counting only the consumer barrier's declared consequence sources) at raw admission and on load, so a false or tampered claim is refused. Not implemented for Population: recurrence of reconciliation objects (the next eligible reconciliation is a consumer-declared dormant object), AS-OF-NOW derived views, any other Population-facing interface (ASR, Health/Provision, KTI, Economy), annual/checkpoint natural change and every item above that is not named here. Production is the second real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): one operation is one temporal object with one earned boundary — its explicitly declared completion boundary, fixture evidence and never a Production cadence — and the two stages of F-017 CG-2 (Production's completion, then the World-State fallback custodian's acceptance, which reads the sealed envelope AS-OF-NOW after the completion commit); registration admission demands exactly the object derived from the committed operation (a hand-written boundary, stage, read or owner is refused), a completion commits only for an engaged, unretired boundary, resolves only at that boundary instant (never a requested horizon), and — like the custodian's acceptance — is published only as its IM-02 stage (the group and intent identity derived from its StageKey, caused by its transaction), so a raw publication of an identical group under any other identity is refused even while canonical time is still before the boundary, stage identity excludes the horizon, retry, source-version churn and slicing, an advance short of the boundary engages and changes nothing, unrelated dormant operations are never read, staged or written, and a completion whose acceptance is unresolved stays completed-but-unavailable, is adopted (not recomputed) by the continuation and is accepted once. Load verification re-checks the derived object, that every completion and acceptance carries that stage identity, and that it is credited by a committed transaction or is an interrupted one awaiting its engaged boundary (the same single rule as admission). Not implemented for Production: recurrence, any Production tick, shift loop or polling, labor/KTI/Economy/Logistics/source-condition temporal reads, GROUP-resolved cycles and any other Production-facing interface. Economy is the third real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): an Economy-sourced operation's one temporal object declares one more stage in the same object and causal process — Economy's realized-access record, a dependent of the custodian's acceptance that reads the demand, request, operation, completion and the accepted entity AS-OF-NOW — so there is no second object, boundary, scheduler, tick or refresh; registration admission demands exactly the derived object (a hand-written object with no Economy stage, an Economy-only object or a changed read is refused), the stage resolves only at the operation's own declared boundary instant and only after the acceptance, and a completed-but-unaccepted or accepted-but-unrealized operation keeps its boundary active across save, close and load until the continuation records access once. Not implemented for Economy: recurrence, any Economy tick, price refresh or market pass, payment/credit/ration boundaries and every other Economy-facing temporal interface. World-State's entity transition is the fourth real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): one causing result is one temporal object with one earned boundary — the instant the cause declares its outcome takes effect, never a World-State cadence — and one declared stage whose commit IS the named Entity Transition Close (F-016 v0.4 §5 R-4). Registration admission demands exactly the object derived from the committed cause (a hand-written boundary, stage, read, close or owner is refused, as is a cause that cannot lawfully transition an already-accepted entity); the transition commits only for an engaged, unretired boundary, resolves only at that instant (never a requested horizon) and is published only as its IM-02 stage; a downstream consumer reads the committed Entity Transition Close AS-OF-NOW (or, as its named close, AS-OF-DECLARED-CLOSE) after it, without mutating or recreating it; and an unresolved or interrupted transition keeps its boundary active across save, close and load while the continuation adopts the committed stage. Not implemented for entity transitions: recurrence, any entity tick or refresh, further transitions of one entity, cause-owner supersession or cancellation, and every other entity-continuity or Logistics-facing temporal interface. The IM-02 coordinator opens each transaction durably BEFORE its first owner stage (F-014B §2, §6 step 1; RC-05): one sealed kernel coordination fact holds the RC-05 opening (identity and cause, trigger, consumed continuation, opening basis, requested target/condition, role/permission context) and every IM-02 owner stage (Production's completion, the custodian's acceptance, Economy's realized access, the entity transition) depends on it. Owner admission and load verification apply the one shared stage rule (the stage identity plus that durable authority, still open and within what the transaction requested), so a raw publication that copies a stage's deterministic identity and names an arbitrary transaction is refused, while a genuine stage committed before the kernel transaction group (the crash window) is adopted by the same transaction when re-presented; stage identity still excludes the horizon, retry, source-version churn and slicing. Not implemented: cancellation or supersession of an opened-but-uncommitted transaction, and any defence against a trusted archivist authority that deliberately writes a lawful opening and its stage raw (that opened transaction is completed by re-presenting it). A dispatched transfer is one temporal object with one earned boundary (its declared delivery boundary) and three declared stages in a lawful NOW order: Logistics' delivery-complete result, World-State's existing ECT-01 destination commit reading it, then Logistics' retirement reading both (the WS-010 section 23 completion edge pair as an order, never an instantaneous cycle); each stage is lawful only under its durable pre-stage transaction authority, and no Logistics tick, polling path or scheduler exists. Named-Actor capability aspect (ninth slice): the owner's declared capability close is one IM-02 stage whose identity is its StageKey alone (actor, capability), declared inside the engaged object of the dependent consequence that materially requires it and read by that consequence AS-OF-DECLARED-CLOSE only (a NOW read of the capability or any read of the uncommitted basis is refused at registration and on load); no tick, turn, phase, periodic advancement pass, sweep or universal actor scan exists, so no capability is resolved unless a consequence engages it. Development/mastery loss is not implemented (a committed capability is sealed), so no same-resolution feedback is possible. The Epistemic packet formation (tenth slice) is declared inside the engaged object of the dependent consequence that materially requires it, reads the Named-Actor capability AS-OF-DECLARED-CLOSE and is read by the consequence AS-OF-NOW after formation; no tick, sweep or universal epistemic/actor scan exists (an event with no engaged consequence forms no packet), an unresolved Epistemic stage freezes only its dependents, and its stage identity is its StageKey alone. KTI (eleventh slice): the KTI result close is the one existing IM-02 declared-close mechanism — the stage reads its sealed basis, the already-sealed F-014D packet (AS-OF-NOW after packet formation) and the development object, publishes the Transfer Package at its declared KTI result close under a StageKey-derived identity (no horizon, version, retry, consumer, packet or slice dimension) and the durable transaction authority, and every other reader reads it only AS-OF-DECLARED-CLOSE naming that close; no same-resolution KTI consequence is visible to, or can flow back into, the packet that caused it (an Epistemic formation can read no KTI state); an unresolved KTI stage freezes nothing independent; there is no tick, scheduler or global KTI scan."
