  - id: IA-01
    family: IA
    title: "Source/version fidelity"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine", "contracts"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Persistence aspect plus owner-registration aspect only: saves record exact creation and last-save spec identity (provenance); loading is gated only by Runtime Contract compatibility, so evidence-only spec changes (lock, register, gates) do not break compatible saves while a different Runtime Contract fails closed until compatibility is declared. Each specification-backed owner/facet registration (world profile/locus, I-002 Existence Contract, RC-13 binding) cites its frozen source at the exact spec-locked pin and IM lowering, and every canonical fact records that citation as its governing rule. Build/package identification beyond persistence, other owners' sources, and explicit migration, are not implemented."
      tests: ["tests/conformance/continuity-conformance.test.ts", "tests/conformance/world-foundation-conformance.test.ts", "tests/integration/continuity.test.ts", "tests/integration/world-foundation.test.ts"]
  - id: IA-02
    family: IA
    title: "No silent semantic invention"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine", "contracts", "testkit"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Persistence/commit aspect plus world/PC/binding aspect only: no default owner, facet, unit, basis or secrecy exists; an empty owner registry fails every write closed; incomplete input is rejected, never repaired. For the included facts, values are strict (an unmodelled field, a delegated world, host-admitted or delegated PC claims, non-activation binding transitions, existing-actor migration and any IR coupling basis other than explicit native/already-there authored under role.player are unrepresentable and fail closed), and basis/secrecy are authored input that is never defaulted. All other semantics (population, economy, time, relationships, epistemics, capabilities, delegation, amendment) are not implemented."
      tests: ["tests/conformance/continuity-conformance.test.ts", "tests/contract/rc-schemas.test.ts", "tests/contract/world-foundation-schemas.test.ts", "tests/integration/store-contract.test.ts", "tests/integration/world-foundation.test.ts"]
  - id: IA-03
    family: IA
    title: "Owner exclusivity / no accidental subsystem"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Commit-core aspect plus first real owners only: a group writes exactly one registered owner/facet; foreign-owner writes are rejected; there is no fallback owner. Specification-backed owners exist for World-State (world profile, world locus), the I-002 Existence Contract and the Role Registry / F-014C player-character binding: each key space belongs to exactly one owner/facet (a raw store commit cannot bypass it), foreign facts are referenced not copied, sealed canon is create-only, and a binding cannot commit before, or create, its PC/world/locus prerequisites, nor without an explicit already-established IR native/already-there coupling basis pinned to those facts (re-verified on every load). The IM-02 temporal kernel is registered as the sole owner of shared orchestration state only (canonical time, stop/remainder continuation, active boundary index, temporal objects, sealed resolution transactions; F-014B §2), its key spaces are exclusive for a raw store commit, it can write no substantive fact, canonical time moves only inside a group that also records exactly one transaction, and a transaction may touch only the objects it engaged. Every other owner adapter (Population, Production, Economy, Actor, Health, Culture, Epistemic, ...) does not exist; the only other owner used is a SYNTHETIC test owner registered through an extension that cannot reuse or write canonical/kernel key spaces."
      tests: ["tests/integration/store-contract.test.ts", "tests/unit/owner-admission.test.ts", "tests/integration/world-foundation.test.ts", "tests/conformance/world-foundation-conformance.test.ts", "tests/integration/temporal-enforcement.test.ts", "tests/conformance/temporal-conformance.test.ts"]
  - id: IA-04
    family: IA
    title: "Turnless causal ordering"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/temporal"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Foundation aspect only, on one deliberately small deterministic fixture under EXACT-PARTITION (CAL-01 stays UNCALIBRATED; no approximate tolerance is represented, accepted, inferred or defaulted): strict RC-03 TemporalRead (AS-OF-NOW / AS-OF-DECLARED-CLOSE with a required producer-named, horizon-independent Close Basis; no third mode), RC-04 StageKey (causal process, owner operation, prospective result; horizon, source version, retry, message count and slice/repartition are structurally not identity dimensions), RC-05 ResolutionTransaction (no universal turn number; opening basis, target/condition, actual stop/remainder, engaged refs, rule/source versions, committed groups, unresolved dependents) and the minimum RC-10 TemporalObject, coordinated by IM-02 over the existing IM-11/IM-12/IM-17 substrate: a transient stage-indexed graph (never persisted) with NOW-only instantaneous SCC testing over stage identity, CLOSE as the only lag cut yet still a dependency, resolution of the causally engaged cone only (active boundary index, no scan), in-place recompute of an unresolved stage under the same StageKey, committed stages adopted and never recreated, bounded stop/remainder persisted and continued after save/close/load, and unrelated dormant state untouched. Canonical time cannot pass an active earned boundary (raw/tampered kernel commits included), RC-05 engaged references keep unresolved work represented and untouched, and a held continuation must be consumed by the next transaction. Not implemented: cancellation/supersession of a held continuation, GROUP mechanisms (so every instantaneous cycle is unlawful), SEALED/EVENT/CONDITIONAL edges, recurrence/recurring boundaries, more than one earned boundary per object, cross-object dependents, APPROXIMATE-PARTITION, stochastic opportunities/hazards, mortality coverage, compression/re-expansion, same-time contention beyond bookkeeping order, the information/interruption gate, no-active-PC stop predicates beyond the one declared boundary predicate, any real subsystem's temporal declaration, and OB-015 live continuation."
      tests: ["tests/contract/temporal-schemas.test.ts", "tests/unit/stage-graph.test.ts", "tests/integration/temporal-foundation.test.ts", "tests/integration/temporal-enforcement.test.ts", "tests/integration/temporal-boundaries.test.ts", "tests/integration/temporal-repairs.test.ts", "tests/integration/temporal-recovery.test.ts", "tests/conformance/temporal-conformance.test.ts"]
