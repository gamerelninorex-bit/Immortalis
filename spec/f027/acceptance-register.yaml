  - id: IA-02
    family: IA
    title: "No silent semantic invention"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine", "contracts", "testkit"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Persistence/commit aspect plus world/PC/binding aspect only: no default owner, facet, unit, basis or secrecy exists; an empty owner registry fails every write closed; incomplete input is rejected, never repaired. For the included facts, values are strict (an unmodelled field, a delegated world, host-admitted or delegated PC claims, non-activation binding transitions, existing-actor migration and any IR coupling basis other than explicit native/already-there authored under role.player are unrepresentable and fail closed), and basis/secrecy are authored input that is never defaulted. All other semantics (population, economy, time, relationships, epistemics, capabilities, delegation, amendment) are not implemented. For the Population facts, values are strict: an unmodelled field (including any agency, belief, behavior, writable overlay, labor, rate, tolerance or approximate cardinality) is unrepresentable, as are Labor Claim as an indexed fact, VERSIONED/EVENT-SNAPSHOT retention, an AS-OF-NOW Cohort read, bounded Cohort instantiation and any close basis other than Population's ordinary reconciliation close; basis/secrecy of Population-written facts are inherited from the authored facts they advance, never defaulted. For the Production facts, values are strict and exact: an unmodelled field (including any labor quantity or coefficient, Population or KTI reference, competence, priority or precedence basis, in-transfer or movement state, source drawdown, yield, ratio, rate, duration default, throughput, price, demand, title, inventory or second writable physical condition), a fractional or approximate quantity, a labor-material support basis, a recurrence and a request carrying a priority/authority reference are unrepresentable and fail closed; the operation's output reference, claim, object and boundary identities are derived from the operation identity alone, and basis/secrecy of Production-written and custodian-written facts are inherited from the authored facts they advance, never defaulted. For the Economy facts, values are strict: an unmodelled field (including any Population count or membership, stock, title, holding, reservation, inventory, price, currency, credit, purchasing capability, entitlement, preference weight, substitution, priority basis, route, delivery or movement field, and any physical-reservation or stock nature of an allocation) is unrepresentable and fails closed; quantities are exact positive integers; the request, its identities, the pre-commit availability and the realized access are derived from the demand and the accepted chain alone, never defaulted, and basis/secrecy of Economy-written facts are inherited from the authored demand they answer. For the entity-transition facts, values are strict: a causing result carries only a cause identity, its source, a referenced subject, one required same-entity locus change with its destination, and its establishment and effect instants; the ECT-01 Entity Transition Close carries only the one entity (predecessor = successor), its continuity unchanged but for locus, the origin it leaves and the destination, the pinned cause and entity versions and the named close. An unmodelled field (including any replacement entity, cessation, form change, changed quantity or condition, agency count, Population effect, holder, title, carrier, path, capacity or in-flight state) and any outcome or continuity relation other than the one same-entity locus change are unrepresentable and fail closed; the transition's identities derive from the cause identity alone, and basis/secrecy of the transition are inherited from the accepted entity, never defaulted."
      tests: ["tests/conformance/continuity-conformance.test.ts", "tests/contract/rc-schemas.test.ts", "tests/contract/world-foundation-schemas.test.ts", "tests/integration/store-contract.test.ts", "tests/integration/world-foundation.test.ts", "tests/contract/population-schemas.test.ts", "tests/unit/population-derive.test.ts", "tests/integration/population-enforcement.test.ts", "tests/contract/production-schemas.test.ts", "tests/unit/production-derive.test.ts", "tests/integration/production-enforcement.test.ts", "tests/conformance/production-conformance.test.ts", "tests/contract/economy-schemas.test.ts", "tests/unit/economy-derive.test.ts", "tests/integration/economy-enforcement.test.ts", "tests/conformance/economy-conformance.test.ts", "tests/contract/entity-transition-schemas.test.ts", "tests/unit/entity-transition-derive.test.ts", "tests/integration/entity-transition-enforcement.test.ts", "tests/conformance/entity-transition-conformance.test.ts"]
  - id: IA-03
    family: IA
    title: "Owner exclusivity / no accidental subsystem"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Commit-core aspect plus first real owners only: a group writes exactly one registered owner/facet; foreign-owner writes are rejected; there is no fallback owner. Specification-backed owners exist for World-State (world profile, world locus), the I-002 Existence Contract and the Role Registry / F-014C player-character binding: each key space belongs to exactly one owner/facet (a raw store commit cannot bypass it), foreign facts are referenced not copied, sealed canon is create-only, and a binding cannot commit before, or create, its PC/world/locus prerequisites, nor without an explicit already-established IR native/already-there coupling basis pinned to those facts (re-verified on every load). The IM-02 temporal kernel is registered as the sole owner of shared orchestration state only (canonical time, stop/remainder continuation, active boundary index, temporal objects, sealed resolution transactions; F-014B §2), its key spaces are exclusive for a raw store commit, it can write no substantive fact, canonical time moves only inside a group that also records exactly one transaction, and a transaction may touch only the objects it engaged. Every other owner adapter (Population, Production, Economy, Actor, Health, Culture, Epistemic, ...) does not exist; the only other owner used is a SYNTHETIC test owner registered through an extension that cannot reuse or write canonical/kernel key spaces. Population (IM-04) is registered as the sole Unit/Count custodian: one owner/facet, three exclusive key spaces (ledger, ordinary close, Cohort), no ledger/count/Cohort-result writer, and admission that re-derives every reconciliation (Closing = Opening + typed Entries - Exits over the eligible unconsumed envelopes, each once; every Cohort result from the new units and the criterion established at the same resolution point), so a consumer, criterion owner, causal owner, synthetic owner or raw store commit cannot write count or membership; an external criterion stays its owner's and is referenced, never copied. No other Population-facing owner (labor, production, economy, KTI, health, military, actor, culture, epistemic) exists; the synthetic criterion/causal/consumer owners used by the fixture cannot write a canonical, kernel or Population key space. Production (IM-05) is registered as the sole owner of production-side Reserve identity/quantity/condition, open claim references, the operation (work/transformation state, realized output in production) and the sealed Durable Completion Envelope: one owner/facet, four exclusive key spaces, no fallback or generic owner, no Asset, Inventory, Labor, Economy, Logistics or KTI owner, and admission that re-derives every start (the claim is for exactly the declared input, supported by the Reserve's unclaimed quantity, on a pinned source-owned request) and every completion (the claimed input consumed exactly once, exactly the declared output sealed once, at the declared engaged boundary), so a requester, Population, another World-State facet, a consumer, a synthetic owner or a raw store commit cannot write Reserve, claim, transformation or output state. After acceptance the World-State fallback physical-entity custodian (one facet, one create-only key space keyed by the conserved reference, no adapter method) is the sole writer of the durable's identity, quantity and condition: Production cannot write it, and an acceptance is re-derived from the pinned completion, so it can be neither forged nor duplicated. Economy (IM-06) is registered as the sole owner of the Demand Envelope with its fixed allocation relation, the Economy-owned Production Request and the realized-access result: one owner/facet, three exclusive create-only key spaces, no fallback, market, exchange, currency, credit, holding, inventory or Logistics owner, and admission that re-derives every issuance (the request is exactly what the demand allocates, the carrier is an already-committed Population Unit or composed non-empty Cohort referenced by identity and pinned version and never copied, no supply existed when the demand was committed) and every realization (re-derived from the committed request, completed operation, Durable Completion Envelope and the World-State custodian's accepted entity, and published only as its IM-02 stage), so Population, Production, World-State, the kernel, a foreign extension owner or a raw store commit cannot write Economy state and Economy cannot write Population, Production, World-State or kernel state. Realized access is a record of access: the physical entity stays with its custodian, and Economy holds no stock, title or reservation. The World-State entity transition adds one create-only key space under the existing World-State fallback custodian (same owner and facet; no new owner, no adapter, no writer): the transition is the only authoritative current-locus change of an accepted entity, one slot per entity, re-derived at admission from the pinned causing result and the accepted entity and published only as its IM-02 stage at its engaged boundary, so the cause owner, a consumer, Production, Economy, Population, the kernel, the PC and role owners, World-State's other facets or a raw store commit cannot create, alter or duplicate it. The accepted entity is never amended (its locality stays the historical origin and ceases to be current only through the transition), so no rival current locus exists; the cause owner establishes cause and causal outcome only. Not implemented: Logistics or any other more-specific entity custodian, a second or later transition of one entity, cessation, form change, fission/fusion, agency topology, Population consequence envelopes, custody or title adjudication and PC intrinsic-authority migration."
      tests: ["tests/integration/store-contract.test.ts", "tests/unit/owner-admission.test.ts", "tests/integration/world-foundation.test.ts", "tests/conformance/world-foundation-conformance.test.ts", "tests/integration/temporal-enforcement.test.ts", "tests/conformance/temporal-conformance.test.ts", "tests/conformance/population-conformance.test.ts", "tests/integration/population-enforcement.test.ts", "tests/integration/population-foundation.test.ts", "tests/integration/production-foundation.test.ts", "tests/integration/production-enforcement.test.ts", "tests/conformance/production-conformance.test.ts", "tests/integration/production-stage-identity.test.ts", "tests/integration/economy-foundation.test.ts", "tests/integration/economy-enforcement.test.ts", "tests/integration/economy-carrier.test.ts", "tests/conformance/economy-conformance.test.ts", "tests/integration/entity-transition-foundation.test.ts", "tests/integration/entity-transition-enforcement.test.ts", "tests/integration/entity-transition-economy.test.ts", "tests/conformance/entity-transition-conformance.test.ts"]
  - id: IA-04
    family: IA
    title: "Turnless causal ordering"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/temporal"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Foundation aspect only, on one deliberately small deterministic fixture under EXACT-PARTITION (CAL-01 stays UNCALIBRATED; no approximate tolerance is represented, accepted, inferred or defaulted): strict RC-03 TemporalRead (AS-OF-NOW / AS-OF-DECLARED-CLOSE with a required producer-named, horizon-independent Close Basis; no third mode), RC-04 StageKey (causal process, owner operation, prospective result; horizon, source version, retry, message count and slice/repartition are structurally not identity dimensions), RC-05 ResolutionTransaction (no universal turn number; opening basis, target/condition, actual stop/remainder, engaged refs, rule/source versions, committed groups, unresolved dependents) and the minimum RC-10 TemporalObject, coordinated by IM-02 over the existing IM-11/IM-12/IM-17 substrate: a transient stage-indexed graph (never persisted) with NOW-only instantaneous SCC testing over stage identity, CLOSE as the only lag cut yet still a dependency, resolution of the causally engaged cone only (active boundary index, no scan), in-place recompute of an unresolved stage under the same StageKey, committed stages adopted and never recreated, bounded stop/remainder persisted and continued after save/close/load, and unrelated dormant state untouched. Canonical time cannot pass an active earned boundary (raw/tampered kernel commits included), RC-05 engaged references keep unresolved work represented and untouched, and a held continuation must be consumed by the next transaction. Not implemented: cancellation/supersession of a held continuation, GROUP mechanisms (so every instantaneous cycle is unlawful), SEALED/EVENT/CONDITIONAL edges, recurrence/recurring boundaries, more than one earned boundary per object, cross-object dependents, APPROXIMATE-PARTITION, stochastic opportunities/hazards, mortality coverage, compression/re-expansion, same-time contention beyond bookkeeping order, the information/interruption gate, no-active-PC stop predicates beyond the one declared boundary predicate, any other real subsystem's temporal declaration, and OB-015 live continuation. Population is the first real subsystem temporal declaration (bounded synthetic fixture): Criterion Owner to Population composition is AS-OF-NOW at the composition point, Population to dependent consumer is AS-OF-DECLARED-CLOSE at the named ordinary reconciliation close (enforced at object registration and re-verified on load), and a consumer-declared PCB-01 barrier makes the next eligible engaged-scope Population reconciliation due only when a committed, eligible, unconsumed envelope precedes and intersects the consumer's engaged scope and the latest close omits it, evaluated for an engaged consumer only (no scan, cadence or second scheduler); otherwise the consumer reads the latest committed close or is not credited, and an unresolved reconciliation leaves independent work eligible; the due claim is retained as evidence in the sealed transaction and re-derived from the committed Population stage group (replaying consumed envelopes in order, counting only the consumer barrier's declared consequence sources) at raw admission and on load, so a false or tampered claim is refused. Not implemented for Population: recurrence of reconciliation objects (the next eligible reconciliation is a consumer-declared dormant object), AS-OF-NOW derived views, any other Population-facing interface (ASR, Health/Provision, KTI, Economy), annual/checkpoint natural change and every item above that is not named here. Production is the second real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): one operation is one temporal object with one earned boundary — its explicitly declared completion boundary, fixture evidence and never a Production cadence — and the two stages of F-017 CG-2 (Production's completion, then the World-State fallback custodian's acceptance, which reads the sealed envelope AS-OF-NOW after the completion commit); registration admission demands exactly the object derived from the committed operation (a hand-written boundary, stage, read or owner is refused), a completion commits only for an engaged, unretired boundary, resolves only at that boundary instant (never a requested horizon), and — like the custodian's acceptance — is published only as its IM-02 stage (the group and intent identity derived from its StageKey, caused by its transaction), so a raw publication of an identical group under any other identity is refused even while canonical time is still before the boundary, stage identity excludes the horizon, retry, source-version churn and slicing, an advance short of the boundary engages and changes nothing, unrelated dormant operations are never read, staged or written, and a completion whose acceptance is unresolved stays completed-but-unavailable, is adopted (not recomputed) by the continuation and is accepted once. Load verification re-checks the derived object, that every completion and acceptance carries that stage identity, and that it is credited by a committed transaction or is an interrupted one awaiting its engaged boundary (the same single rule as admission). Not implemented for Production: recurrence, any Production tick, shift loop or polling, labor/KTI/Economy/Logistics/source-condition temporal reads, GROUP-resolved cycles and any other Production-facing interface. Economy is the third real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): an Economy-sourced operation's one temporal object declares one more stage in the same object and causal process — Economy's realized-access record, a dependent of the custodian's acceptance that reads the demand, request, operation, completion and the accepted entity AS-OF-NOW — so there is no second object, boundary, scheduler, tick or refresh; registration admission demands exactly the derived object (a hand-written object with no Economy stage, an Economy-only object or a changed read is refused), the stage resolves only at the operation's own declared boundary instant and only after the acceptance, and a completed-but-unaccepted or accepted-but-unrealized operation keeps its boundary active across save, close and load until the continuation records access once. Not implemented for Economy: recurrence, any Economy tick, price refresh or market pass, payment/credit/ration boundaries and every other Economy-facing temporal interface. World-State's entity transition is the fourth real subsystem temporal declaration (bounded synthetic fixture, EXACT-PARTITION): one causing result is one temporal object with one earned boundary — the instant the cause declares its outcome takes effect, never a World-State cadence — and one declared stage whose commit IS the named Entity Transition Close (F-016 v0.4 §5 R-4). Registration admission demands exactly the object derived from the committed cause (a hand-written boundary, stage, read, close or owner is refused, as is a cause that cannot lawfully transition an already-accepted entity); the transition commits only for an engaged, unretired boundary, resolves only at that instant (never a requested horizon) and is published only as its IM-02 stage; a downstream consumer reads the committed Entity Transition Close AS-OF-NOW (or, as its named close, AS-OF-DECLARED-CLOSE) after it, without mutating or recreating it; and an unresolved or interrupted transition keeps its boundary active across save, close and load while the continuation adopts the committed stage. Not implemented for entity transitions: recurrence, any entity tick or refresh, further transitions of one entity, cause-owner supersession or cancellation, and every other entity-continuity or Logistics-facing temporal interface."
      tests: ["tests/contract/temporal-schemas.test.ts", "tests/unit/stage-graph.test.ts", "tests/integration/temporal-foundation.test.ts", "tests/integration/temporal-enforcement.test.ts", "tests/integration/temporal-boundaries.test.ts", "tests/integration/temporal-repairs.test.ts", "tests/integration/temporal-recovery.test.ts", "tests/conformance/temporal-conformance.test.ts", "tests/integration/population-foundation.test.ts", "tests/integration/population-enforcement.test.ts", "tests/conformance/population-conformance.test.ts", "tests/integration/production-foundation.test.ts", "tests/integration/production-enforcement.test.ts", "tests/conformance/production-conformance.test.ts", "tests/integration/production-stage-identity.test.ts", "tests/integration/economy-foundation.test.ts", "tests/integration/economy-enforcement.test.ts", "tests/conformance/economy-conformance.test.ts", "tests/integration/entity-transition-foundation.test.ts", "tests/integration/entity-transition-enforcement.test.ts", "tests/conformance/entity-transition-conformance.test.ts"]
  - id: IA-05
    family: IA
    title: "Claims / contention / liveness"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/commit"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Bounded aspect only, on one deliberately small deterministic fixture: an RC-06 claim on one conserved Production Reserve quantity, held open by the Reserve's own open-claim list and checked by identity (no scan of unrelated Reserves or world state). A claim the Reserve's unclaimed quantity does not support — an incompatible claim against already-committed material — receives no credit and records nothing (no immortal pending object for a failed claim); the supported remainder is credited exactly and one unit more is not, so the same quantity never supports two mutually exclusive committed uses; consumed material cannot be re-claimed. A claim is not title, inventory, ownership or an automatic priority: it carries no priority basis (a priority/authority reference is unrepresentable), there is no preemption, ranking or displacement, and commit order confers no precedence beyond the committed quantity itself. A changed intent cannot reuse the original receipt or identity. For Economy, the same Production claim is the only physical commitment: an Economy request that Production cannot support with unclaimed Reserve quantity receives no credit and no Economy result (demand does not create supply), and Economy holds no physical reservation, title or stock; there is no purchasing capability, entitlement, price or priority in the demand or the request. Not implemented: whole-engine contention and liveness, same-instant contention between simultaneously staged stages, owner-supplied allocation/priority rules or choosers, personnel/labor claims (CAL-02), claims on any non-Production conserved key, starvation/liveness analysis, and Economy allocation or exchange mechanisms (purchasing capability, entitlement, price, scarcity, substitution, priority)."
      tests: ["tests/integration/production-foundation.test.ts", "tests/integration/production-enforcement.test.ts", "tests/contract/production-schemas.test.ts", "tests/unit/production-derive.test.ts", "tests/integration/economy-foundation.test.ts", "tests/integration/economy-enforcement.test.ts", "tests/unit/economy-derive.test.ts"]
  - id: IA-06
    family: IA
    title: "Atomic publication / idempotent recovery"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/commit", "engine/persistence"]
    status: NOT_IMPLEMENTED
