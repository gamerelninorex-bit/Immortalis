sumed by KTI only after packet formation (a basis cannot precede it), only for the recipient it names and a development object it supports (its payload referent is the canonical object_id: an opaque equality, never a language match), under the mode-consumer invariant (KTI rests only on a BOUNDED_SHARED_ACCESS event naming that one recipient; an unlowered BROADCAST_EXPOSURE is never receipt and fails closed), and establishes, through the explicit KTI-owner Transfer Basis (a formed packet alone creates nothing), one active, engine-sealed, KTI-owned Transfer Package per programme source_id × recipient × development-object programme, published at the KTI result close. The package is workflow state only: receipt does not become comprehension, competence, reproduction, adoption, belief, institutional uptake or diffusion, and the sealed packet is never recreated, improved or reinterpreted by a KTI consequence. Not implemented: KTI encounter, intelligibility, competence and PARTIAL-depth facets, Transfer Package completion or retirement, practitioner-basis arithmetic, training, reproduction, adoption, diffusion, continuity, doctrine, institutional development, Diplomacy staging, F-014D reads of KTI state, BROADCAST_EXPOSURE lowering. Active-PC recipient (thirty-fourth slice): a BOUNDED_SHARED_ACCESS event may name as its one recipient the entity the committed Role Registry binding role.player_character names (the event asserts the role; admission, registration, formation and load verification check it against the binding by identity, so an Existence Contract alone, an unbound or other identity, an aggregate, or a Named-Actor event whose identity is later bound gets no packet); where the payload's form depends on a capability the packet references the exact committed I-002 PC capability fact and version read AS-OF-DECLARED-CLOSE at the PC Capability Close (F-016 Phase 2B PCC-03) through the existing PC close-read builder, with no fallback between the PC and Named-Actor capabilities, no reading, thresholding or conversion of the marker, and no capability or Causal Draw established by F-014D; a PC capability not committed at that close leaves the formation unresolved and writes nothing. Not implemented: PC cognition, comprehension, belief and presentation, broadcast or cohort access, presence and range, latency, retrieval and memory, Past-Basis reconstruction, KTI for a PC recipient, capability development or loss, and cross-handover reconstruction, so the row stays NOT_IMPLEMENTED."
