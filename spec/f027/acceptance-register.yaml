same owner and facet as the fallback entity) cites WG at its exact spec-locked pin and IM-03 lowering, with F-016 v0.4's manifest and successor-delta (ECT-01) pins and F-017's pin in its lineage, and every entity-transition fact records that citation as its governing rule. The IM-05 Logistics owner registration (the movement-service commitment, the transfer record and Logistics' delivery-complete result kinds; one owner/facet) cites WS-010 at its exact spec-locked pin and IM-05 lowering, with F-017's and F-016 v0.4's pins in its lineage, and every Logistics fact records that citation as its governing rule. For the Named-Actor capability (ninth slice) the registration aspect only: the Named-Actor kinds cite WS-016 and, in the lineage, WS-006 / F-014A at their exact spec-locked pins and the IM-07 lowering; nothing else of WS-006, WS-016, F-014A or I-002 is claimed. Epistemic Access (tenth slice) the registration aspect only: the Epistemic kinds (access event, Accessible Content Packet, Sealed Engine Provenance; one owner/facet) cite F-014D at its exact spec-locked pin and IM-10 lowering, with the W1-PS2 provenance-split ratification, WS-016's pin and F-017's pin in the lineage, and every Epistemic fact records that citation as its governing rule; nothing else of F-014D, F-014A or KTI is claimed. KTI (eleventh slice): the IM-09 KTI owner registration (development object, Transfer Package basis and active Transfer Package kinds; one owner/facet) cites WS-002 at its exact spec-locked pin and the IM-09 lowering, with the KTI v0.3 pair, F-014D's pin, F-017's and the Runtime Contract's in the lineage. GIP (twelfth slice): the IM-06 GIP owner registration (the Institution Identity kind; one owner/facet) cites WS-007 at its exact spec-locked pin and the IM-06 lowering, with the GIP Scaling Profile v1.1 (Red-confirmed at pin 2026-09-25T00:59:55.526Z), the OB-046 closed record, F-017's and the Runtime Contract's pins in the lineage, and every GIP fact records that citation as its governing rule; nothing else of WS-007 is claimed. GIP Office / Authority Locus (thirteenth slice): the Office / Authority Locus kind is registered under the same IM-06 GIP owner and facet as an ADVANCING (not SEALED) kind with its own exclusive key space, citing WS-007 at the same exact spec-locked pin and IM-06 lowering — Draft v2.1 §§2.1, 2.2, 3.2 and 21.1/21.2 with Scaling Profile v1.1 §3 and §5 — with the same lineage, and every office fact records that citation as its governing rule and is re-verified against it on load. GIP Decision-Body Office Reference Branch (fourteenth slice): no new fact kind, owner, facet or key space is registered — the decision_body_ref branch is a value of the same registered Office / Authority Locus kind, so its owner, ADVANCING lifecycle and exclusive key space are unchanged; its governing-rule citation keeps the same WS-007 artifact, exact native pin and authority lineage with the clause updated to the implemented holder_ref OR decision_body_ref surface, every new office of either branch records and is re-verified against that current citation on load, and the thirteenth-slice citation is accepted on load only, whole, for a genuine legacy holder-branch office (a decision-body office carrying it, or any altered or other rule, is rule drift), so existing holder saves load without migration or rewriting. GIP Authority Scope Binding (fifteenth slice): one new registered fact kind, gip_scope_binding, beneath the existing GIP owner and facet, ADVANCING in kind, in its own exclusive key space (the parent office key plus its own scope_binding_id); it cites WS-007 at the exact spec-locked pin (Draft v2.1 §2.1, §5 Scope / Applicability Binding and §21.1/§21.2, with Scaling Profile v1.1 §3 Scope Binding cardinality, §4 and §5) with the same authority lineage as the other GIP kinds, every binding records that citation as its governing rule and is re-verified against it on load, and the Office / Authority Locus citation and its thirteenth-slice historical compatibility are unchanged byte for byte (the office citation is never stamped on, or accepted for, a binding). GIP Governance Instrument Core (sixteenth slice): one new registered fact kind, gip_governance_instrument, beneath the existing GIP owner and facet, ADVANCING in kind, in its own exclusive key space (gip/instrument/ plus the exact instrument_id alone); it cites WS-007 at the exact spec-locked pin (Draft v2.1 §2.1, §4.1 Mandatory fields and the core validity and lifecycle literals, §4.2 Operative-effect classes and §21.1/§21.2, with Concept Amendment v2.1 A7 and Scaling Profile v1.1 §3 Instrument/Clause cardinality, §4 and §5) with the same authority lineage as the other GIP kinds, every Instrument records that citation as its governing rule and is re-verified against it on load, and the identity, office (current and thirteenth-slice historical) and Scope Binding citations are unchanged byte for byte (none is stamped on, or accepted for, an Instrument). The seven WS-007 §4.1 identifiers (instrument_id, source_authority_ref, authority_basis_ref, singular operative_effect, scope_binding_ref, validity_by_order[] with governing_order_ref and validity_status, lifecycle_status) and every core literal are reproduced exactly, without renaming, pluralising, normalising or broadening. Diplomacy External Recognition Core (seventeenth slice): one new registered fact kind, diplomacy_external_recognition, under a new IM-06 Diplomacy owner (distinct from GIP and Economy) and one External Recognition facet, ADVANCING in kind, in its own exclusive key space (diplomacy/recognition/ plus the exact recognition_id alone); it cites WS-008 Diplomacy v1.1 at the exact spec-locked pin (v1.1 §2.1, §2.2, §6 External Recognition, §24 invariants 7-8, §29.2, §29.3, §29.7 and §29.8 m-4) with the WS-007 / GIP Concept Amendment v2.1, F-016 Phase 2C and F-017 lineage, every recognition records that citation as its governing rule and is re-verified against it on load, and no other kind's citation is changed. The WS-008 identifiers (recognition_id, recognizer_ref, recognized_referent_ref, recognition_scope, recognition_status, authority_basis_ref, effective_from, instrument_or_act_ref, provenance_ref, continuity_basis, the optional withdrawal_or_supersession_condition and the conditional successor_rule_ref and dependency_refs[]) are reproduced exactly, without renaming, pluralising, normalising or aliasing; the listed recognition_status values round-trip exactly and are not a closed enum, and the continuity_basis examples are not a closed enum."
