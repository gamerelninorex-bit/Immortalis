  - id: IA-02
    family: IA
    title: "No silent semantic invention"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine", "contracts", "testkit"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Persistence/commit aspect plus world/PC/binding aspect only: no default owner, facet, unit, basis or secrecy exists; an empty owner registry fails every write closed; incomplete input is rejected, never repaired. For the included facts, values are strict (an unmodelled field, a delegated world, host-admitted or delegated PC claims, non-activation binding transitions, existing-actor migration and any IR coupling basis other than explicit native/already-there authored under role.player are unrepresentable and fail closed), and basis/secrecy are authored input that is never defaulted. All other semantics (population, economy, time, relationships, epistemics, capabilities, delegation, amendment) are not implemented. For the Population facts, values are strict: an unmodelled field (including any agency, belief, behavior, writable overlay, labor, rate, tolerance or approximate cardinality) is unrepresentable, as are Labor Claim as an indexed fact, VERSIONED/EVENT-SNAPSHOT retention, an AS-OF-NOW Cohort read, bounded Cohort instantiation and any close basis other than Population's ordinary reconciliation close; basis/secrecy of Population-written facts are inherited from the authored facts they advance, never defaulted. For the Production facts, values are strict and exact: an unmodelled field (including any labor quantity or coefficient, Population or KTI reference, competence, priority or precedence basis, in-transfer or movement state, source drawdown, yield, ratio, rate, duration default, throughput, price, demand, title, inventory or second writable physical condition), a fractional or approximate quantity, a labor-material support basis, a recurrence and a request carrying a priority/authority reference are unrepresentable and fail closed; the operation's output reference, claim, object and boundary identities are derived from the operation identity alone, and basis/secrecy of Production-written and custodian-written facts are inherited from the authored facts they advance, never defaulted. For the Economy facts, values are strict: an unmodelled field (including any Population count or membership, stock, title, holding, reservation, inventory, price, currency, credit, purchasing capability, entitlement, preference weight, substitution, priority basis, route, delivery or movement field, and any physical-reservation or stock nature of an allocation) is unrepresentable and fails closed; quantities are exact positive integers; the request, its identities, the pre-commit availability and the realized access are derived from the demand and the accepted chain alone, never defaulted, and basis/secrecy of Economy-written facts are inherited from the authored demand they answer. For the entity-transition facts, values are strict: a causing result carries only a cause identity, its source, a referenced subject, one required same-entity locus change with its destination, and its establishment and effect instants; the ECT-01 Entity Transition Close carries only the one entity (predecessor = successor), its continuity unchanged but for locus, the origin it leaves and the destination, the pinned cause and entity versions and the named close. An unmodelled field (including any replacement entity, cessation, form change, changed quantity or condition, agency count, Population effect, holder, title, carrier, path, capacity or in-flight state) and any outcome or continuity relation other than the one same-entity locus change are unrepresentable and fail closed; the transition's identities derive from the cause identity alone, and basis/secrecy of the transition are inherited from the accepted entity, never defaulted. For the Logistics facts (single-leg transfer), values are strict: an unmodelled field (including any route, path, carrier, capacity, rate, priority or authority reference, cargo quantity or condition, loss, partial delivery, second leg, diversion, labor or agency claim) is unrepresentable, a dispatch has no field in which a delivery could be asserted, and the delivery-complete result is exactly the existing causing-result envelope; the Logistics identities derive from the request identity alone, the delivery boundary is an explicit declared input (no calibrated duration exists), and basis/secrecy of Logistics-written facts are authored or inherited from the request, never defaulted. Named-Actor capability aspect (ninth slice): values are strict — a comparative marker is exactly C/B/A/S or EX with a causal descriptor (or an explicit null, never a below-C rung), and an unmodelled field (including any number, XP, level, percentage, modifier, roll, prior, seed, scope, constraint, raw bodily property, equipment, temporary effectiveness, office, KTI state, observer belief, aggregate/cohort/population/institution reference, body or entity reference and lifecycle transfer) is unrepresentable and fails closed; basis/secrecy are authored or inherited from the authored basis, never defaulted; the genuine-uncertainty branch of the Named-Actor establishment (a bounded prior with randomization) is unrepresentable and fails closed with an Implementation Escalation because the engine has no lawful uncertainty mechanism for it. Not implemented: development/mastery-loss amendment, lifecycle transfer, Scope/Constraints, aggregate bound supply, individuation/promotion, PC capability and the rest of F-014A. The Epistemic Access contracts (tenth slice) are strict: no unmodelled field is carried, so BROADCAST_EXPOSURE, audience/cohort/membership/office/group, comprehension, recognition, inference, credibility, belief, stance, decision, any score or number, any grade conversion or threshold, and any true-source field in the actor-safe packet are unrepresentable; no Epistemic module reads, compares or converts a capability marker. Not implemented: every other F-014D surface (see IA-16). KTI (eleventh slice): the KTI development object, Transfer Package basis and Transfer Package are strict — an unmodelled field (comprehension, competence, reproduction, adoption, adherence, belief, diffusion, continuity, headcount, faction/cohort/audience scope, F-014D event or provenance content, institution, any number, or any lifecycle status other than ACTIVE) is unrepresentable; BROADCAST_EXPOSURE and every other mode, cohort or audience scope fail closed; no default owner, facet, class, packet-to-object linkage or completion rule exists; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). GIP Institution Identity (twelfth slice): the identity is strict — exactly institution_id, identity_label and the single continuing continuity_status; an unmodelled field (including any office, power, authority, membership list or count, faction posture, legal instrument, asset, resource, KTI state, actor belief, relationship, military capability, economic holding, territory, generic property bag, predecessor/successor/constitutive-source reference and every lifecycle transition — renamed, split, merged, abolished, replaced) is unrepresentable and fails closed; basis/secrecy are authored input that is never defaulted; no institution is auto-created from a label, population, culture, charter text, faction, treaty, settlement or organization-like object; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). GIP Office / Authority Locus (thirteenth slice): the office is strict — exactly the WS-007 §3.2 minimum in its holder_ref branch (office_id, institution_id, authority_source_ref, competence_scope, powers, duties, selection_rule, succession_rule, removal_rule, holder_ref), every value explicit and authored (nothing defaulted, guessed from a label or derived from the Institution Identity or a holder), the authority, power, duty and rule texts and the two references carried as authored and never resolved, parsed or interpreted; delegations, concurrence requirements, review/veto/override, conditional authority, any appointment/removal/succession state, holder history, exercise or reach state, any authority or state copied onto a holder, and any catch-all property are unrepresentable and fail closed; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). Not implemented: every other WS-007 surface (authority topology, Governance Instruments, procedures, scope bindings, political relations, pending decisions, administrative reach, stability), every Institution Identity lifecycle transition, and every office transition (appointment, removal, succession, delegation, authority amendment and holder replacement fail closed). GIP Decision-Body Office Reference Branch (fourteenth slice): the office admits exactly one of the two WS-007 §3.2 reference fields — holder_ref OR decision_body_ref — as two strict branches with no discriminator field: both together, neither and any unmodelled field fail closed, and an existing holder-branch value is unchanged; decision_body_ref is an opaque canonical reference carried as authored and never resolved against any owner, and no decision-body object, membership or roster, council, faction, Autonomous Collective or Named-Actor state, procedure, deliberation, vote, closure, consent, permission, authority exercise, body replacement or holder/body switch has a representation; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). GIP Authority Scope Binding (fifteenth slice): the Scope Binding is a strict contract of the WS-007 §5 minimum beneath one exact office — scope_binding_id, scope_type, scope_ref, target_condition and the optional inheritance_rule, exception_refs[] (an array of opaque references) and priority_or_conflict_rule_ref (one opaque reference, not an array) — plus the parent office's own institution_id and office_id; every value is authored and explicit, an omitted optional field stays absent (null and explicit undefined fail closed) and an authored empty array stays empty, and an unmodelled field fails closed; scope_ref, exception_refs[] and priority_or_conflict_rule_ref are opaque and never resolved, compared, ranked or applied against World, Population, Institution, Actor, Autonomous Collective, Culture or any other owner, target_condition and inheritance_rule are carried text that is never parsed or executed (no scope taxonomy, condition language or rule language exists), the office competence_scope is never read, parsed or rewritten, and no Governance Instrument, validity or lifecycle result, applicability result (applies, does_not_apply, contested, unresolved), promulgation, decision procedure, vote, authority exercise, Administrative Reach, awareness, compliance, Actor or Autonomous Collective choice or institutional KTI consequence has a representation; every post-establishment scope, inheritance, exception or priority-or-conflict change, replacement or resolution fails closed; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). GIP Governance Instrument Core (sixteenth slice): the Instrument is a strict contract of exactly the WS-007 §4.1 mandatory fields — instrument_id, source_authority_ref, authority_basis_ref, operative_effect (ONE singular scalar; operative_effects, an array, an unknown literal or any alias fails closed), scope_binding_ref, validity_by_order[] (a mandatory authored array of strict entries of exactly governing_order_ref and validity_status; it introduces no source-undefined minimum cardinality, uniqueness, deduplication, merging or conflict-resolution rule, so an empty array and repeated governing_order_ref entries are carried exactly as authored) and lifecycle_status — with the exact core validity (valid, invalid, void, contested, unresolved), lifecycle (proposed, pending, active, suspended, superseded, repealed, terminated, expired) and operative-effect literals, void kept distinct from invalid and validity kept independent of lifecycle; source_authority_ref and scope_binding_ref are exact addresses of an already-committed Office / Authority Locus (holder_ref or decision_body_ref branch alike) and of a Scope Binding of that same office, a Scope Binding of a different authority fails closed; authority_basis_ref and every governing_order_ref are opaque and never dereferenced (no governing-order, constitutional-law or authority-basis object exists); every WS-007 §4.3 conditional field (activation_condition, effective_from, sunset_condition, renewal_rule, implementation_assignment_ref, administrative_path_ref, sanction_or_remedy, institutional_promulgation_or_publication_requirement, promulgation_act_ref, individual_notice_requirement_ref, appeal_review_override, predecessor_instrument_ref, supersession_ref, provenance_note) and addressable clauses are unsupported in this slice and fail closed rather than being ignored; every validity and lifecycle value is authored, none is calculated or advanced, and no decision procedure, vote, Actor or Autonomous Collective choice, applicability result, promulgation, dissemination, Administrative Reach, implementation, enforcement or compliance has a representation; every post-establishment Instrument mutation fails closed as unsupported; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser). Diplomacy External Recognition Core (seventeenth slice): the recognition contract is strict (an unmodelled field, an alias of a source identifier, a singular reference given as an array, a missing required field, or a Relation Edge, Channel, Negotiation Record, Instrument, Clause, Binding Entry, Framework, claim, dispute, compliance, score, reciprocal or generic property field fails closed); recognition_status and continuity_basis are carried as authored named values with no invented closed set and no alias normalisation; recognizer_ref and recognized_referent_ref are directional opaque references with no recognizer-party or referent class restriction (notably no GIP-office-only restriction on recognizer_ref); recognition_scope is required and singular, its source-undefined subtype is not narrowed (any canonical JSON value is carried exactly as authored) and no recognition score exists; authority_basis_ref, instrument_or_act_ref, provenance_ref and successor_rule_ref are opaque and never dereferenced; withdrawal_or_supersession_condition is optional (absent stays absent; when present, any canonical JSON value is carried exactly as authored, with no source-undefined subtype imposed) and successor_rule_ref is never fabricated or required; dependency_refs[] stays conditional with no invented minimum, uniqueness or deduplication, a baseline record invents no dependency and a dependency-derived record pins exactly the facts it names; effective_from is required and carried exactly as authored (any canonical JSON value, with no source-undefined subtype imposed) and schedules nothing; no recognition is inferred from silence, contact, trade, negotiation, treaty-making or conduct, no objective existence, control, awareness or internal-law consequence is inferred, no reciprocal record is created, and every post-establishment recognition mutation fails closed as unsupported; GitHub Issue #11 is untouched (no RNG, seed, roll, prior, default or chooser)."
