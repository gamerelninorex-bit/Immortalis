    source: "Foundation Tranche v0.1 §6"
    packages: ["engine/commit"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Bounded aspect only, on one deliberately small deterministic fixture: an RC-06 claim on one conserved Production Reserve quantity, held open by the Reserve's own open-claim list and checked by identity (no scan of unrelated Reserves or world state). A claim the Reserve's unclaimed quantity does not support — an incompatible claim against already-committed material — receives no credit and records nothing (no immortal pending object for a failed claim); the supported remainder is credited exactly and one unit more is not, so the same quantity never supports two mutually exclusive committed uses; consumed material cannot be re-claimed. A claim is not title, inventory, ownership or an automatic priority: it carries no priority basis (a priority/authority reference is unrepresentable), there is no preemption, ranking or displacement, and commit order confers no precedence beyond the committed quantity itself. A changed intent cannot reuse the original receipt or identity. For Economy, the same Production claim is the only physical commitment: an Economy request that Production cannot support with unclaimed Reserve quantity receives no credit and no Economy result (demand does not create supply), and Economy holds no physical reservation, title or stock; there is no purchasing capability, entitlement, price or priority in the demand or the request. Not implemented: whole-engine contention and liveness, same-instant contention between simultaneously staged stages, owner-supplied allocation/priority rules or choosers, personnel/labor claims (CAL-02), claims on any non-Production conserved key, starvation/liveness analysis, and Economy allocation or exchange mechanisms (purchasing capability, entitlement, price, scarcity, substitution, priority)."
