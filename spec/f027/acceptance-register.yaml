      scope: "Partial: all-or-nothing group publication, idempotent identity (RC-16), changed-intent rejection (CAL-07), UNKNOWN_OUTCOME reconciliation by intent_id, and crash-point convergence on the local file package. Publication-time revalidation of actor/rule/epoch/foreign claims and any provider-specific behavior are not implemented. A resolution transaction (several owner stage groups plus one kernel group) reuses this machinery and converges, by identity and without blind retry, on the identical campaign after a failure at every durable step; a stage committed before the failure is adopted from the journal, never recomputed or recreated. The Population PCB-01 transaction (a Population stage group, a consumer stage group and one kernel group) converges, by identity and without blind retry, on the identical campaign after a failure at every durable step: the envelope is consumed exactly once, the Population close/Cohort results are never duplicated, and a stage committed before the failure is adopted and still recorded as the due reconciliation. The Production completion transaction (a Production stage group, a custodian stage group and one kernel group) converges, by identity and without blind retry, on the identical campaign after a failure at every durable step: the claimed input is consumed once, the durable is sealed and accepted once, and a stage committed before the failure is adopted and never recomputed; re-presenting a committed start intent returns its original receipt, while a changed claim under the same intent, or the same group identity under a new intent, is refused. The Economy issuance (a demand with its one Production Request, one group) and the Economy-sourced completion transaction (a Production stage group, a custodian stage group, an Economy stage group and one kernel group) converge, by identity and without blind retry, on the identical campaign after a failure at every durable step: one demand, one request, one consumption, one output, one acceptance and one realized access, and a stage committed before the failure is adopted and never recomputed; re-presenting a committed issuance returns its original receipt, while a changed carrier under the same intent is refused. The entity-transition transaction (a World-State stage group, a downstream consumer stage group and one kernel group) converges, by identity and without blind retry, on the identical campaign after a failure at every durable step: one transition, one consumer result and no sibling current locus, and a stage committed before the failure is adopted and never recomputed. The transaction's opening (kernel authority), its owner stage(s) and its kernel transaction group converge, by identity and without blind retry, on the identical campaign after a failure at every durable step: never a stage without its opening, never a second opening, stage or result, and the same transaction identity under a different request is a conflict. The Logistics commitment, the dispatch and the completion transaction (authority, delivery stage, destination commit, retirement stage, kernel group) converge, by identity and without blind retry, on the identical campaign after a failure at every durable step and across save, close and load at every cut of the transfer lifecycle (committed, dispatched, delivered but uncommitted, destination committed with retirement pending, retired): never a second commitment, transfer, delivery result, transition or retirement, and exactly one authority answers where the entity is at every cut. Named-Actor capability aspect (ninth slice): the authored basis publication and the capability-close transaction (authority, close stage, consuming stage, kernel group) converge by identity after a crash or lost reply at every durable step, a committed close is adopted never recomputed or re-rolled (no randomness exists), an UNKNOWN outcome is reconciled by identity before retry, and a changed intent is refused; a corrupted or inconsistent saved capability fails the load/integrity path rather than being normalized. No real-OS-process cut was added for this slice. The Epistemic path (tenth slice): save, close, load and continue at seven durable cuts of the event/formation/consumption lifecycle; a crash and a lost reply at every durable step of the event publication and of the formation transaction (authority, capability close, packet and sealed provenance, consuming stage, kernel group) converge by identity on the identical campaign; a committed formation is adopted, never re-formed or improved; a corrupted or inconsistent saved event, packet or provenance fails the load/integrity path rather than being normalized. No real-OS-process cut was added for this slice. KTI (eleventh slice): the authored development-object and Transfer Package basis publications and the result-close transaction (authority, KTI stage, consuming stage, kernel group) converge by identity after a crash or a lost reply at every durable step, and save → close → load → continue at eight durable cuts preserves the object, basis, packet reference, active package and result-close evidence exactly; an occupied programme slot stays occupied; corrupted or inconsistent saved KTI state fails the load path. GIP Institution Identity (twelfth slice): a retry or a lost reply for the same establishment intent converges on the original receipt and one identity, a failure injected before or after every durable step of the file package converges on the identical campaign, and a conflicting establishment (another label or intent, or the same intent with changed content) for an established institution fails closed without rewriting it. GIP Office / Authority Locus (thirteenth slice): a retry or a lost reply for the same office establishment intent converges on the original receipt and one office, a failure injected before or after every durable step of the file package converges on the identical campaign, save → close → load → continue preserves the same office, authority fields, prerequisite Institution Identity pin and provenance at every cut, a conflicting establishment (another holder, power, source or intent, or the same intent with changed content) for an established office fails closed without rewriting it or minting a sibling authority, and load verification fails closed on a tampered or corrupted office, a moved or version-advanced office, a missing or mismatched prerequisite identity, and a changed pin or dependency. GIP Decision-Body Office Reference Branch (fourteenth slice): a retry or lost reply for a decision-body office establishment converges on the original receipt and one office, save → close → load → continue preserves the selected branch, the decision_body_ref and every authored authority field beside unchanged holder-branch offices (existing holder-branch saves load without migration), and load verification fails closed on a tampered branch or reference (body replaced, holder added beside or substituted for the body, no reference, an emptied or structured reference, copied authority, membership), a moved or version-advanced office and a changed pin. GIP Authority Scope Binding (fifteenth slice): a retry or lost reply for a binding establishment converges on the original receipt and one binding, a failure injected before or after every durable step of the package converges on the identical campaign, save → close → load → continue preserves every authored field (including optional inheritance, exception and priority-or-conflict material), the parent-office linkage, the prerequisite pin, provenance and governing rule exactly, and load verification fails closed on a tampered binding or parent linkage, a moved or version-advanced binding, a missing, mismatched or foreign-pinned parent office or institution chain, a changed pin or dependency, and a drifted or substituted governing-rule citation. GIP Governance Instrument Core (sixteenth slice): a retry or lost reply for an Instrument establishment converges on the original receipt and one Instrument, a failure injected before or after every durable step of the package converges on the identical campaign, save → close → load → continue preserves every authored field, both references, the validity entries and lifecycle, both prerequisite pins, provenance and governing rule exactly (beneath either office branch), a conflicting establishment at the same instrument_id fails closed without overwriting, and load verification fails closed on a tampered Instrument value, source-office or Scope Binding reference or prerequisite, a moved or version-advanced Instrument, a missing, mismatched or cross-authority office or binding or lost institution chain, a changed pin or dependency, and a drifted or substituted governing-rule citation. Diplomacy External Recognition Core (seventeenth slice): a retry or lost reply for a recognition establishment converges on the original receipt and one recognition, a failure injected before or after every durable step of the package converges on the identical campaign, save → close → load → continue preserves every authored field (including the optional condition, successor_rule_ref, listed and unlisted statuses, an unlisted continuity_basis and dependency_refs[]), the dependency pins, provenance and governing rule exactly, a conflicting establishment at the same recognition_id fails closed without overwriting, and load verification fails closed on a tampered recognition value, alias, array-shaped singular field or reciprocal copy, a moved or version-advanced recognition, a changed, missing or invented dependency pin, a second write in the group, and a drifted or substituted governing-rule citation, while an upstream write to a registered dependency is reported as invalidation by the keyed read and is not treated as corruption."
