    partial_evidence:
      scope: "Measurement of one narrow aspect only, on the bounded Population fixture: a PCB-01 reconciliation reads only the engaged consumer, the engaged ledger, its Criterion Owner fact, its causal owner's register and the one due reconciliation object, by identity; no store listing or scan occurs on the advance path, and an unrelated Population ledger, its Cohort, its register and its dormant reconciliation object are never read, staged, invalidated or written. No universal budget is adopted (CAL-06, CAL-10); load-time verification remains a diagnostic listing. A Production completion transaction likewise reads only the engaged operation's own facts and the world/locus it is attached to, by identity: an unrelated Reserve, operation, claim and temporal object are never read, staged, invalidated or written, no store listing occurs on the advance path, and a refused claim is resolved from its own Reserve's open-claim list without scanning any unrelated Reserve. An Economy-sourced completion transaction likewise reads only the engaged operation's chain by identity (its demand and request, operation, completion, accepted entity, world/locus and canonical time): an unrelated demand, operation, Reserve, Population ledger and temporal object are never read, staged, invalidated or written, and no store listing occurs on the advance path. A World-State entity-transition transaction likewise reads only the engaged cause's own facts, the accepted entity and the destination world/locus by identity: an unrelated entity, its object, an unrelated Reserve and temporal object are never read, staged, invalidated or written, and no store listing occurs on the advance path. A Logistics transfer transaction likewise reads only the engaged movement's own facts (its request, the entity, the world/locus and the chain it produces) by identity: an unrelated entity, its commitment, an unrelated Reserve and temporal object are never read, staged, invalidated or written, and no store listing occurs on the advance path. Named-Actor capability aspect (ninth slice): resolving one actor's capability reads only the engaged basis, its object and its consumer by identity and writes only that actor's keys; an unrelated actor's basis, history and dormant consequence are never read, staged or written, and no listing occurs on the advance path. No universal budget is adopted. Epistemic (tenth slice): resolving one recipient's packet reads the engaged event, its object and the consumer by identity and writes only that event/recipient's access keys; an unrelated event, actor and dormant consequence are never read, staged or written, no listing occurs on the advance path, and no packet forms for an event with no engaged consequence. No universal budget is adopted. KTI (eleventh slice): the advance path reads the engaged basis, packet and development object by identity and writes only that programme's package (no scan of other recipients, objects or packets, no standing KTI object); an unrelated or dormant programme is neither read nor written. GIP (twelfth slice): establishing or reading one Institution Identity reads and writes only that identity's own key by exact identity; an unrelated dormant institution is never read, listed, scanned or touched, and no listing occurs on the establish or read path (only the diagnostic load-time verifier lists facts, once per open). GIP Office / Authority Locus (thirteenth slice): establishing or reading one office reads and writes only the addressed institution's identity key and that office's own key by exact identity; an unrelated dormant institution or office is never read, listed, scanned or touched, no listing occurs on the establish or read path, and no clock, tick, RNG or polling mechanism exists. GIP Decision-Body Office Reference Branch (fourteenth slice): establishing a decision-body office reads only the addressed institution's identity key and writes only the office's own key, decision_body_ref is never looked up (the reads are the same whatever the reference names), and no listing, clock, tick, RNG or polling mechanism exists. GIP Authority Scope Binding (fifteenth slice): establishing a binding reads only its parent office's key and writes only the binding's own key, reading one binding is a direct keyed read, scope_ref, exception_refs[] and priority_or_conflict_rule_ref are never looked up (the reads are the same whatever they name), an unrelated dormant institution, office or binding is never read, listed, scanned or touched, and no listing, clock, tick, RNG or polling mechanism exists. No universal budget is adopted. GIP Governance Instrument Core (sixteenth slice): establishing an Instrument reads only its source office key and its Scope Binding key and writes only the Instrument's own key, reading one Instrument is a direct keyed read, authority_basis_ref and governing_order_ref are never looked up (the reads are the same whatever they name), an unrelated dormant institution, office, binding or Instrument is never read, listed, scanned or touched, and no listing, clock, tick, RNG or polling mechanism exists. No universal budget is adopted. Diplomacy External Recognition Core (seventeenth slice): establishing a baseline recognition reads nothing and writes only the recognition's own key, a dependency-derived recognition reads only the facts its dependency_refs[] names, reading one recognition is a direct keyed read (plus its own dependency keys), recognizer_ref, recognized_referent_ref, authority_basis_ref, instrument_or_act_ref, provenance_ref and successor_rule_ref are never looked up, an unrelated dormant recognition, relation, party or foreign-owner fact is never read, listed, scanned or touched, and no listing, clock, tick, scheduler, watcher, polling loop or RNG exists. No universal budget is adopted."
      tests: ["tests/integration/population-foundation.test.ts", "tests/integration/production-foundation.test.ts", "tests/integration/economy-foundation.test.ts", "tests/integration/entity-transition-foundation.test.ts", "tests/integration/logistics-foundation.test.ts", "tests/integration/actor-foundation.test.ts", "tests/integration/epistemic-foundation.test.ts", "tests/integration/kti-foundation.test.ts", "tests/integration/kti-recovery.test.ts", "tests/integration/gip-foundation.test.ts", "tests/integration/gip-office-foundation.test.ts", "tests/integration/gip-office-decision-body.test.ts", "tests/integration/gip-scope-binding.test.ts", "tests/integration/gip-instrument.test.ts", "tests/integration/diplomacy-recognition.test.ts", "tests/integration/diplomacy-recognition-recovery.test.ts"]
    note: "Measurement only; no universal budget adopted (CAL-06, CAL-10)."
