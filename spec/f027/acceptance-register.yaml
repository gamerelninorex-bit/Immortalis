  - id: IA-03
    family: IA
    title: "Owner exclusivity / no accidental subsystem"
    source: "Foundation Tranche v0.1 §6"
    packages: ["engine"]
    status: NOT_IMPLEMENTED
    evidence: null
    partial_evidence:
      scope: "Commit-core aspect plus first real owners only: a group writes exactly one registered owner/facet; foreign-owner writes are rejected; there is no fallback owner. Specification-backed owners exist for World-State (world profile, world locus), the I-002 Existence Contract and the Role Registry / F-014C player-character binding: each key space belongs to exactly one owner/facet (a raw store commit cannot bypass it), foreign facts are referenced not copied, sealed canon is create-only, and a binding cannot commit before, or create, its PC/world/locus prerequisites, nor without an explicit already-established IR native/already-there coupling basis pinned to those facts (re-verified on every load). The IM-02 temporal kernel is registered as the sole owner of shared orchestration state only (canonical time, stop/remainder continuation, active boundary index, temporal objects, sealed resolution transactions; F-014B §2), its key spaces are exclusive for a raw store commit, it can write no substantive fact, canonical time moves only inside a group that also records exactly one transaction, and a transaction may touch only the objects it engaged. Every other owner adapter (Population, Production, Economy, Actor, Health, Culture, Epistemic, ...) does not exist; the only other owner used is a SYNTHETIC test owner registered through an extension that cannot reuse or write canonical/kernel key spaces. Population (IM-04) is registered as the sole Unit/Count custodian: one owner/facet, three exclusive key spaces (ledger, ordinary close, Cohort), no ledger/count/Cohort-result writer, and admission that re-derives every reconciliation (Closing = Opening + typed Entries - Exits over the eligible unconsumed envelopes, each once; every Cohort result from the new units and the criterion established at the same resolution point), so a consumer, criterion owner, causal owner, synthetic owner or raw store commit cannot write count or membership; an external criterion stays its owner's and is referenced, never copied. No other Population-facing owner (labor, production, economy, KTI, health, military, actor, culture, epistemic) exists; the synthetic criterion/causal/consumer owners used by the fixture cannot write a canonical, kernel or Population key space. Production (IM-05) is registered as the sole owner of production-side Reserve identity/quantity/condition, open claim references, the operation (work/transformation state, realized output in production) and the sealed Durable Completion Envelope: one owner/facet, four exclusive key spaces, no fallback or generic owner, no Asset, Inventory, Labor, Economy, Logistics or KTI owner, and admission that re-derives every start (the claim is for exactly the declared input, supported by the Reserve's unclaimed quantity, on a pinned source-owned request) and every completion (the claimed input consumed exactly once, exactly the declared output sealed once, at the declared engaged boundary), so a requester, Population, another World-State facet, a consumer, a synthetic owner or a raw store commit cannot write Reserve, claim, transformation or output state. After acceptance the World-State fallback physical-entity custodian (one facet, one create-only key space keyed by the conserved reference, no adapter method) is the sole writer of the durable's identity, quantity and condition: Production cannot write it, and an acceptance is re-derived from the pinned completion, so it can be neither forged nor duplicated. Economy (IM-06) is registered as the sole owner of the Demand Envelope with its fixed allocation relation, the Economy-owned Production Request and the realized-access result: one owner/facet, three exclusive create-only key spaces, no fallback, market, exchange, currency, credit, holding, inventory or Logistics owner, and admission that re-derives every issuance (the request is exactly what the demand allocates, the carrier is an already-committed Population Unit or composed non-empty Cohort referenced by identity and pinned version and never copied, no supply existed when the demand was committed) and every realization (re-derived from the committed request, completed operation, Durable Completion Envelope and the World-State custodian's accepted entity, and published only as its IM-02 stage), so Population, Production, World-State, the kernel, a foreign extension owner or a raw store commit cannot write Economy state and Economy cannot write Population, Production, World-State or kernel state. Realized access is a record of access: the physical entity stays with its custodian, and Economy holds no stock, title or reservation. The World-State entity transition adds one create-only key space under the existing World-State fallback custodian (same owner and facet; no new owner, no adapter, no writer): the transition is the only authoritative current-locus change of an accepted entity, one slot per entity, re-derived at admission from the pinned causing result and the accepted entity and published only as its IM-02 stage at its engaged boundary, so the cause owner, a consumer, Production, Economy, Population, the kernel, the PC and role owners, World-State's other facets or a raw store commit cannot create, alter or duplicate it. The accepted entity is never amended (its locality stays the historical origin and ceases to be current only through the transition), so no rival current locus exists; the cause owner establishes cause and causal outcome only. Not implemented: Logistics or any other more-specific entity custodian, a second or later transition of one entity, cessation, form change, fission/fusion, agency topology, Population consequence envelopes, custody or title adjudication and PC intrinsic-authority migration. The IM-02 transaction authority is one sealed kernel kind of the existing kernel owner and facet (no new owner): only the kernel can write it, an opening is lawful only at the temporal state it read, for a transaction identity not yet committed and consuming exactly the continuation the state holds, and the sealed transaction must repeat exactly what its authority opened. Logistics (IM-05; one owner and facet, three exclusive entity-keyed key spaces) owns the non-agentive movement-service commitment, the transfer record and the authoritative movement locus while a transfer is active, and nothing else: no other owner can write a Logistics key (a raw store commit cannot bypass it), Logistics can write no entity, transition, request, Production, Economy or kernel key, the Movement Service Request stays its requester's own fact, and the entity's identity, quantity, condition and stationary truth stay with World-State (the accepted entity is never amended). The destination handoff is World-State's existing ECT-01 transition, committed only for a delivery Logistics established; Logistics retires the transfer and releases the commitment only after that commit, re-derived from the committed chain (so a raw retirement, an early retirement or a forged stage is refused), and an entity Logistics is committed to move changes locus only through that movement's own delivery result, so World-State and Logistics can never hold rival current loci. One movement slot exists per entity: a competing, duplicate or later movement fails closed. Named-Actor capability aspect (ninth slice): one owner/facet named_actor/actor_profile holds two exclusive create-only actor/capability-keyed key spaces (the authored establishment basis and the capability published at the actor owner's declared capability close); every other owner is refused them and the Named-Actor owner is refused every foreign or unmodelled key; there is no fallback actor owner; a capability is exactly what its committed basis determines and exists only as its IM-02 stage; a consequence cannot conjure the capability it needs; Population is untouched. KTI, Epistemic and equipment/embodiment/office state remain with their (unimplemented) owners and are referenced, never copied. The IM-10 Epistemic Access owner (tenth slice, epistemic_access/epistemic_access) owns three exclusive create-only key spaces - the engine-side BOUNDED_SHARED_ACCESS event, the actor-safe Accessible Content Packet and the engine-only Sealed Engine Provenance - under one F-014D rule; the owner of the source/carrier an event rests on gains no Epistemic write authority (it is referenced by pinned version, never copied); the Epistemic owner reads the Named-Actor capability only AS-OF-DECLARED-CLOSE and never writes a capability or any foreign key; a packet exists only as its IM-02 stage and a consequence cannot conjure access. KTI (eleventh slice): the IM-09 KTI owner (one facet, three exclusive create-only key spaces: development object, transfer basis, Transfer Package) is the sole writer of its key spaces for a raw store commit as much as for the owner paths (the Epistemic and Named-Actor owners and every consumer are refused them); the KTI owner writes no Epistemic, Named-Actor, Population, PC, World-State or institution key; the package is KTI-owned workflow state that references, never copies, the sealed packet and its source. GIP (twelfth slice): the IM-06 GIP owner (one facet, one exclusive create-only key space: the Institution Identity) is the sole writer of its key space for a raw store commit as much as for the owner path (every predecessor owner, a synthetic owner and every consumer are refused it); the GIP owner writes no foreign key and no unmodelled GIP key (no instrument, membership, faction or relation); the identity is GIP's own definition that reads and depends on no foreign fact, with one slot per canonical institution_id, sealed and create-only so no rival writable identity can exist; GIP declares no stage, close, tick, phase or standing temporal object; and a committed identity is read by exact identity by later consumers without any GIP write authority. GIP Office / Authority Locus (thirteenth slice): the office is a second exclusive key space under the same IM-06 GIP owner and facet, kind ADVANCING so a later lawful owner-defined transition can move the same canonical office along its expected-version chain without a second ledger or sibling record, and sole-writer for a raw store commit as much as for the owner path (every predecessor owner, a synthetic owner and every consumer are refused it); the GIP owner writes no foreign key and no unmodelled GIP key (no office sub-state, holder, delegation, instrument, membership, faction or relation); an office is created once, at expected version zero, resting on exactly its one committed Institution Identity read by exact institution_id key at its current version and depended on (a label, a foreign fact or another institution's identity never substitutes, and an office cannot precede its institution); the holder_ref is a bare reference that copies no authority, personality, capability, knowledge or permission into any actor or other owner's state; establishment writes nothing outside the one office key; and every attempt to move an established office is refused by GIP admission as unsupported (no transition exists yet) while a second creation fails on the version chain. GIP Decision-Body Office Reference Branch (fourteenth slice): a decision-body office is created by the same GIP owner at the same canonical institution_id × office_id key (the reference branch is not an identity dimension, so no sibling authority exists), at expected version zero, resting on the same one committed Institution Identity; decision_body_ref is a bare reference that is never read, resolved or dereferenced and copies no authority into any body, member, actor or other owner's state, establishment writes nothing outside the one office key, and every attempt to replace the body, switch holder and body or otherwise move an established office is refused by GIP admission as unsupported. GIP Authority Scope Binding (fifteenth slice): a Scope Binding is created by the same GIP owner and facet at one exclusive key, institution_id × office_id × scope_binding_id, at expected version zero, resting on exactly one committed fact — its parent Office / Authority Locus, read by exact key at its current version and depended on, whose own Institution Identity ancestry must still be committed — so a binding cannot precede, or be attached to a different, mismatched or tampered, office; the binding is stored once at its office (distinct bindings are distinct only by their canonical authored identities, and no per-recipient, resident, Population-member, actor or transaction copy exists), the office, its holder or decision-body reference and the Institution Identity are left byte for byte unchanged, establishment writes nothing outside the one binding key and reads nothing but the parent office, no foreign-owner state is created or copied from any referent, and every attempt to move an established binding is refused by GIP admission as unsupported while a second creation fails on the version chain. GIP Governance Instrument Core (sixteenth slice): an Instrument is created by the same GIP owner and facet at one exclusive key, gip/instrument/ plus its canonical instrument_id alone (the office, the Scope Binding, a governing order, a recipient, a subject and the lifecycle status are not identity dimensions), at expected version zero, resting on exactly two committed facts — its source Office / Authority Locus and a Scope Binding of that same office, each read by exact key at its current version and depended on, with the office's Institution Identity ancestry still committed — so an Instrument cannot precede, or be attached to a different, mismatched or tampered, authority or binding; the Instrument is stored once (validity_by_order[] stays inside it; no per-recipient, per-subject, per-place or per-governing-order copy and no clause or multi-effect surrogate exists), the office, the binding and the Institution Identity are left byte for byte unchanged, establishment writes nothing outside the one Instrument key and creates no foreign-owner state from any opaque reference, and every attempt to move an established Instrument is refused by GIP admission as unsupported while a second creation fails on the version chain. Diplomacy External Recognition Core (seventeenth slice): a recognition is created by the new Diplomacy owner (one External Recognition facet, a separate owner from GIP and Economy) at one exclusive key, diplomacy/recognition/ plus its canonical recognition_id alone (the recognizer, the referent, the scope and the status are not identity dimensions), at expected version zero; no other registered owner may write that key space and the Diplomacy owner may write no other owner's key space; the recognition is stored once (no reciprocal or symmetric copy, no per-recipient, per-population-member, per-place or per-observer copy, and no all-pairs scan), establishment writes nothing outside the one recognition key and creates no foreign-owner state (GIP, World, Actor, ACS, Population, Culture, Economy, Epistemic or any other) from any opaque reference, the establishment creates no Relation Edge record, no Channel, Negotiation Record, Instrument, Clause, Binding Entry or Framework key space exists, and every attempt to move an established recognition is refused by Diplomacy admission as unsupported while a second creation fails on the version chain. Diplomacy Externalized Claim / Dispute Core (eighteenth slice): a dispute is created by the existing Diplomacy owner (one more facet, no second owner; GIP and Economy gain nothing) at one exclusive key, diplomacy/dispute/ plus its canonical dispute_id alone (the parties, the underlying subject, the status and the optional references are not identity dimensions), at expected version zero; no other registered owner may write that key space, the Diplomacy owner may write no other owner's key space, and the recognition and dispute facets cannot write each other's key space; the dispute is stored once (no copy per party, observer, population member, locus, clause or relation, and no all-pairs or all-disputes scan), establishment writes nothing outside the one dispute key and creates no underlying claim or foreign-owner state from any opaque reference, the establishment creates no Relation Edge record, no Channel, Negotiation Record, Instrument, Clause, Binding Entry, Framework or receipt key space exists, and every attempt to move an established dispute is refused by Diplomacy admission as unsupported while a second creation fails on the version chain. Diplomacy Relation Edge Authoritative Core (nineteenth slice): an edge is created by the existing Diplomacy owner (one more facet, no second owner; GIP and Economy gain nothing) at one exclusive key, diplomacy/relation/ plus its canonical relation_id alone (the parties, the scope and the statuses are not identity dimensions), at expected version zero; no other registered owner may write that key space, the Diplomacy owner may write no other owner's key space, and the recognition, dispute and relation edge facets cannot write each other's key space; the edge is stored once (no copy per party, observer, recognition, dispute, channel or instrument, and no all-pairs or all-relations scan), establishment reads and depends on nothing, writes nothing outside the one edge key, and creates no foreign-owner state from any opaque reference and no association with an existing Recognition or Claim / Dispute record; no derived-index, Channel, Negotiation Record, Instrument, Clause, Binding Entry or Framework key space exists, and every attempt to move an established edge is refused by Diplomacy admission as unsupported while a second creation fails on the version chain. GIP Institution Identity Constitutive Source Reference (twentieth slice): the optional constitutive_source_ref is not an identity dimension; the identity stays at gip/institution/<institution_id>/identity under the same GIP owner, facet, SEALED create-only lifecycle and one-slot-per-institution rule whether the reference is absent, equal or different; establishment with the reference still reads and depends on nothing, writes exactly one identity key, and creates, reads, copies or mutates no Governance Instrument, constitutive act or other source record. Governance Instrument Predecessor Reference (twenty-first slice): the optional predecessor_instrument_ref is not an identity dimension; the Instrument stays at gip/instrument/<instrument_id> under the same GIP owner, facet, ADVANCING-in-kind classification and one-slot-per-instrument rule whether the reference is absent, equal or different; establishment with the reference still reads and depends on exactly the existing source Office and Scope Binding prerequisites, writes exactly one Instrument key in one commit, and creates, reads, copies or mutates no predecessor Instrument, Office, Scope Binding or other record, and no new owner, facet, fact kind, key space, adapter method or module is added. Diplomacy Framework Authoritative Core (twenty-second slice): a Framework is created by the existing Diplomacy owner (one more facet, no second owner; GIP, Economy and every other owner gain nothing) at one exclusive key, diplomacy/framework/ plus its canonical framework_id alone (the members, charter, rules, commitments, lifecycle status and provenance are not identity dimensions), at expected version zero; no other registered owner may write that key space, the Diplomacy owner may write no other owner's key space, and the recognition, dispute, relation edge and framework facets cannot write each other's key space; the Framework is stored once (no copy per member, relation, instrument, observer, population unit or locus, and no all-pairs or all-frameworks scan), establishment reads and depends on nothing, writes nothing outside the one Framework key, and creates no foreign-owner state, GIP institution, ACS, Instrument or member decision from any opaque reference and no association with an existing Relation Edge, Recognition or Claim / Dispute record; no derived-index, Channel, Negotiation Record, Instrument, Clause or Binding Entry key space exists, and every attempt to move an established Framework is refused by Diplomacy admission as unsupported while a second creation fails on the version chain; the WS-008 §29.5 decision-owner boundary (a GIP-owned framework institution owns its procedure, a promoted autonomous collective resolves its own decision) is recorded as an ownership boundary only, with no procedure implemented. Twenty-sixth slice (F-027-CD1), Causal Draw aspect only: `causal_draw_kernel` / `draw_provenance` is an infrastructure-only RC-09 evidence owner/facet owning exactly two exclusive, create-only (SEALED) key spaces (`causal-draw/<digest>/precommit` and `/result`); no other owner can write them, it can write nothing else (no substantive world fact, no fallback owner), and the substantive slot is inspected only through a narrow IM-03 typed-owner interface, never inferred. PC capability (twenty-eighth slice): the PC capability profile is a second FACET of the one PC owner pc_existence, never a second PC capability owner; its two exclusive create-only key spaces cannot be written by any other owner or facet — including the PC owner's own Existence Contract facet and the Named-Actor owner — for a raw store commit as much as for the adapter; a basis is received only as an already-established capability pinned to the PC's own committed, released Existence Contract and to accepted claim locators (read and depended on, never copied), the persisted capability exists only as the IM-02 PC Capability Close stage and is exactly what its basis determines, every cross-owner read is AS-OF-DECLARED-CLOSE only, and a capability already held by the Named-Actor owner cannot also be received by the PC owner. Not implemented (fail closed): any wiring of the PC close to Epistemic, KTI or Insertion consumers, development or loss, deferred derivation, Revelation, handover and transfer, so the row stays NOT_IMPLEMENTED. Existing-actor compilation (twenty-ninth slice): no new owner, facet, key space, fact kind, adapter or module; one optional strict field on the existing Existence Contract fact classifies the compilation of an already-existing actor and pins that actor's own committed Named-Actor state by exact owner, key and version (read and depended on, never copied); until the Role Registry binding commit the prior non-PC owner stays writable, a fresh or arbitrary PC cannot use the exception, and for a raw store commit as much as for the owner paths ordinary Role Registry activation and the ACCEPTED_GENERATION_HISTORY PC capability receipt both refuse the compilation. Not implemented (fail closed): the Existing-Actor → PC Role Registry handover transition itself, so the row stays NOT_IMPLEMENTED."
